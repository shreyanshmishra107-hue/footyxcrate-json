name: Auto Update All-In-One JSON (Every 2 Mins)

on:
  schedule:
    # Triggers every 15 minutes; each run loops 7 times (every 2 mins)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-allinone-json
  cancel-in-progress: true

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config --local user.email "bot@footyxcrate.site"
          git config --local user.name "FootyXCrate Bot"

      - name: Loop every 2 minutes (7 cycles)
        run: |
          for i in {1..7}; do
            echo "--- Cycle $i at $(date -u) ---"
            python fetch.py
            git pull --rebase || true
            git add allinone.json
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "Update allinone.json (cycle $i)"
              git push
            fi
            if [ $i -lt 7 ]; then
              sleep 120
            fi
          done
